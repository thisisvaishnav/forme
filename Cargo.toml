[package]
name = "forme"
version = "0.1.0"
edition = "2021"
description = "A fast, local-first whiteboard built in Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "forme-serve"
path = "src/bin/serve.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3", features = [
  "Blob",
  "CanvasRenderingContext2d",
  "Clipboard",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "FileReader",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "PointerEvent",
  "Storage",
  "TextMetrics",
  "Url",
  "WheelEvent",
  "Window",
] }
